<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>AYLYES Launcher</title>
<style>
  :root {
    --bg: #05060a; --panel: #0d1018; --panel-2: #10141f; --border: #1e2536;
    --text: #e7ecff; --muted: #6d7690; --cyan: #29f5ff; --purple: #b46bff;
    --green: #3ef5a0; --red: #ff5c7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    user-select: none;
    display: flex; flex-direction: column;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: baseline; gap: 8px; }
  .logo .name {
    font-weight: 800; letter-spacing: 3px; font-size: 16px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo .sub { font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .who-row { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--purple); cursor: pointer; font-size: 11px; padding: 0; }

  .view { display: none; flex: 1; min-height: 0; }
  .view.active { display: flex; flex-direction: column; }

  /* login / otp: centrados, angostos */
  #loginView, #otpView { align-items: center; justify-content: center; padding: 30px; }
  .auth-box { width: 100%; max-width: 300px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 13px;
    outline: none; user-select: text;
  }
  .field input:focus { border-color: var(--cyan); }

  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 999px;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .btn.primary { background: linear-gradient(90deg, var(--cyan), var(--purple)); color: #05060a; }
  .btn.danger { background: rgba(255,92,122,0.12); border: 1px solid var(--red); color: var(--red); }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .error { color: var(--red); font-size: 11px; margin-top: 10px; min-height: 14px; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 10px 0; }

  /* pantalla principal: grilla de paises */
  #mainView { padding: 0; }
  .status-strip {
    display: none; align-items: center; gap: 12px; padding: 12px 20px;
    background: rgba(62,245,160,0.08); border-bottom: 1px solid rgba(62,245,160,0.3); flex-shrink: 0;
  }
  .status-strip.show { display: flex; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); flex-shrink: 0; }
  .status-country { font-weight: 700; font-size: 13px; }
  .status-time { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .status-ip { color: var(--cyan); font-size: 11px; margin-top: 2px; font-family: 'Consolas', monospace; user-select: text; }
  .status-strip .btn.danger { width: auto; padding: 6px 14px; font-size: 11px; margin-left: auto; }

  .grid-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 20px; }
  .region-header {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan);
    margin: 16px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .region-header::before { content: "◆"; font-size: 8px; }
  .country-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
  }
  .country-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .country-card:hover { border-color: var(--cyan); transform: translateY(-1px); }
  .country-card:disabled, .country-card.loading { opacity: 0.5; pointer-events: none; }
  .country-card .flag { font-size: 20px; }
  .country-card .code { font-size: 11px; color: var(--muted); float: right; }
  .country-card .name { font-size: 12px; margin-top: 8px; color: var(--text); }

  .main-error { padding: 0 20px 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="name">AYLYES</span><span class="sub">LAUNCHER</span></div>
  <div class="who-row" id="whoRow" style="display:none;">
    <span id="whoami"></span>
    <button class="link-btn" id="logoutBtn">Salir</button>
  </div>
</div>

<div id="loginView" class="view active">
  <div class="auth-box">
    <div class="field"><label>Usuario</label><input type="text" id="loginUsername" /></div>
    <div class="field"><label>Clave</label><input type="password" id="loginPassword" /></div>
    <button class="btn primary" id="loginBtn">Iniciar sesion &rarr;</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div id="otpView" class="view">
  <div class="auth-box">
    <p class="hint">Te mandamos un codigo por Telegram.</p>
    <div class="field"><label>Codigo</label><input type="text" id="otpCode" maxlength="6" placeholder="000000" /></div>
    <button class="btn primary" id="otpBtn">Verificar &rarr;</button>
    <div class="error" id="otpError"></div>
  </div>
</div>

<div id="mainView" class="view">
  <div class="status-strip" id="statusStrip">
    <div class="status-dot"></div>
    <div>
      <span class="status-country" id="connectedCountry"></span>
      <span class="status-time" id="connectedTime"></span>
      <div class="status-ip" id="connectedIp"></div>
    </div>
    <button class="btn danger" id="disconnectBtn">Desconectar</button>
  </div>
  <div class="error main-error" id="mainError"></div>
  <div class="grid-scroll" id="gridScroll"></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
